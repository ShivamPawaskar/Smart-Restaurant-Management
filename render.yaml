services:
  - type: web
    name: spicy-garden-backend
    runtime: node
    rootDir: backend
    buildCommand: npm install
    startCommand: npm run db:setup && npm start
    healthCheckPath: /api/health
    disk:
      name: sqlite-data
      mountPath: /var/data
      sizeGB: 1
    envVars:
      - key: NODE_ENV
        value: production
      - key: SQLITE_PATH
        value: /var/data/restaurant.sqlite
      - key: JWT_EXPIRES_IN
        value: 8h
      - key: CLIENT_URL
        sync: false
      - key: JWT_SECRET
        sync: false
